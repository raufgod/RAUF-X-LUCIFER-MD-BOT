<text x="450" y="25" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#a78bfa">rauf-lucifer — bash</text>
<text x="28" y="76" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#e9d5ff" opacity="0" xml:space="preserve">$ git clone https://github.com/raufgod/RAUF-X-LUCIFER-MD-BOT.git<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.01;.96;1" dur="16s" begin="1.0s" repeatCount="indefinite"/></text>
<text x="28" y="110" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#e9d5ff" opacity="0" xml:space="preserve">$ cd RAUF-X-LUCIFER-MD-BOT<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.01;.96;1" dur="16s" begin="2.7s" repeatCount="indefinite"/></text>
<text x="28" y="144" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#e9d5ff" opacity="0" xml:space="preserve">$ npm install --legacy-peer-deps<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.01;.96;1" dur="16s" begin="4.4s" repeatCount="indefinite"/></text>
