<text x="28" y="212" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#e9d5ff" opacity="0" xml:space="preserve">$ cp .env.example .env &amp;&amp; nano .env<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.01;.96;1" dur="16s" begin="7.8s" repeatCount="indefinite"/></text>
