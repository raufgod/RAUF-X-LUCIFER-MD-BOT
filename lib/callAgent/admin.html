<!doctype html>
<html lang="en" data-theme="black"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Arya – admin</title>
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;--spring:cubic-bezier(.3,1.35,.5,1)}
html[data-theme=black]{color-scheme:dark;--bg:#050506;--text:#f4f3ef;--mute:#a7a59c;--blue:#f54e00;--cyan:#ff8a4c;--ok:#35e0a1;--err:#ff6b81;--glass:rgba(255,255,255,.085);--glass2:rgba(255,255,255,.13);--gbd:rgba(255,255,255,.16);--ghi:rgba(255,255,255,.28);--glo:rgba(0,0,0,.45);--gsh:rgba(0,0,0,.5)}
html[data-theme=white]{color-scheme:light;--bg:#f2f2f7;--text:#16161a;--mute:#5b5b66;--blue:#f54e00;--cyan:#ff7a33;--ok:#0f9d6b;--err:#d92d4b;--glass:rgba(255,255,255,.6);--glass2:rgba(255,255,255,.8);--gbd:rgba(255,255,255,.9);--ghi:#fff;--glo:rgba(60,60,67,.1);--gsh:rgba(60,60,67,.16)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--font);min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 30px);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(50vmax 40vmax at 10% 0%,rgba(245,78,0,.3),transparent 62%),radial-gradient(44vmax 36vmax at 100% 35%,rgba(120,70,255,.22),transparent 62%)}
.w{max-width:760px;margin:0 auto}
.glass,.c,.j,.hd,.box{background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,0) 45%),var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gbd);box-shadow:inset 0 1.5px 0 var(--ghi),inset 0 -1px 0 var(--glo),0 12px 36px var(--gsh)}
.hd{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:999px;margin-bottom:16px}
h1{font-size:17px;font-weight:760;letter-spacing:-.02em;flex:1}h1 small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
h2{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:22px 4px 10px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--gbd);background:var(--glass2);color:var(--text);font-size:18px;cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 1px 0 var(--ghi)}
.box{border-radius:28px;padding:16px;margin:12px 0}
input,button{font:inherit;color:inherit}
input{width:100%;border-radius:18px;border:1px solid var(--gbd);background:var(--glass2);padding:13px 16px;font-size:16px}input:focus{outline:2px solid var(--blue);outline-offset:1px}
button{border-radius:999px;border:1px solid var(--gbd);background:var(--glass2);padding:13px 22px;font-weight:650;cursor:pointer;width:100%;margin-top:10px;box-shadow:inset 0 1px 0 var(--ghi);transition:transform .25s var(--spring)}button:active{transform:scale(1.04)}
button.p,#go,#blk{background:linear-gradient(180deg,var(--cyan),var(--blue));color:#fff;border:0}
.row{display:flex;gap:10px}.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
.c{border-radius:24px;padding:16px}.c b{display:block;font-size:26px;font-weight:780;letter-spacing:-.03em}.c span{font-size:13px;color:var(--mute)}
.j{border-radius:22px;padding:12px 16px;margin:10px 0;font-size:14.5px}.j small{color:var(--mute)}
.s{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:650;background:color-mix(in srgb,var(--mute) 22%,transparent)}
.s.sent{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}.s.pending,.s.sending{background:rgba(255,190,60,.22);color:#ffbe3c}.s.awaiting{background:rgba(90,140,255,.22);color:#7fa6ff}
.s.failed,.s.no-whatsapp,.s.skipped,.s.opted-out{background:color-mix(in srgb,var(--err) 22%,transparent);color:var(--err)}
#msg{margin:8px 4px;color:#ffbe3c;min-height:20px;font-size:14px}
.auto{display:flex;align-items:center;gap:10px;margin:10px 4px;color:var(--mute);font-size:14px}.auto input{width:auto}
</style></head><body><div class="w">
<div class="hd"><h1>🎙 Arya voice agent<small>Admin · calls &amp; voice notes</small></h1><button class="ib" id="th" type="button" aria-label="Theme" style="width:42px;margin:0;padding:0">☀️</button></div>
<div class="box"><input id="k" type="password" placeholder="CALL_ADMIN_SECRET" autocomplete="off">
<div class="row"><button id="go" type="button">Load status</button><button class="g" id="rf" type="button">Refresh</button></div>
<label class="auto"><input type="checkbox" id="ar"> Auto-refresh every 20 s</label></div>
<div id="msg"></div>
<div id="out" hidden>
  <div class="grid" id="cards"></div>
  <h2>Block a number</h2>
  <div class="box"><input id="n" type="tel" inputmode="numeric" placeholder="919876543210 (with country code)"><button id="blk" type="button">Block this number</button><div style="color:var(--mute);font-size:13px;margin-top:8px">Arya will never message a blocked number.</div></div>
  <h2>Latest jobs</h2><div id="jobs"></div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},K='arya_admin_k';
  try{$('k').value=sessionStorage.getItem(K)||''}catch(e){}
  function say(t){$('msg').textContent=t||''}
  function api(path,opt){opt=opt||{};opt.headers=Object.assign({'x-call-admin-secret':$('k').value.trim()},opt.headers||{});return fetch(path,opt).then(function(r){return r.json().catch(function(){return{}}).then(function(j){j.__s=r.status;return j})})}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function ago(t){if(!t)return'-';var m=Math.round((Date.now()-t)/60000);return m<1?'now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'}
  function load(){say('Loading…');api('/admin/call/data').then(function(j){
    if(j.__s===401){say('Wrong password.');$('out').hidden=true;return}
    if(j.__s===429){say('Too many wrong tries. Wait a while.');return}
    if(!j.ok){say('Could not load.');return}
    try{sessionStorage.setItem(K,$('k').value.trim())}catch(e){}
    say('');$('out').hidden=false;var c=j.counts||{},card=function(a,b){return'<div class="c"><b>'+esc(a)+'</b><span>'+esc(b)+'</span></div>'};
    $('cards').innerHTML=card(j.whatsappReady?'Online':'Offline','WhatsApp')+card(j.sentLastHour,'sent, last hour')+card(j.sentLast24h,'sent, last 24 h')+card(j.optedOut,'blocked numbers')+
      Object.keys(c).map(function(s){return card(c[s],s)}).join('');
    $('jobs').innerHTML=(j.jobs||[]).slice().reverse().map(function(x){return'<div class="j"><b>'+esc(x.name)+'</b> <span class="s '+esc(x.status)+'">'+esc(x.status)+'</span><br><small>'+esc(x.number)+' · replies: '+(x.turns||0)+' · '+(x.sentAt?'sent '+ago(x.sentAt):'due '+ago(x.dueAt))+(x.note?' · '+esc(x.note):'')+(x.error?' · err: '+esc(x.error):'')+'</small></div>'}).join('')||'<small>No jobs yet.</small>';
  }).catch(function(){say('Network error.')})}
  $('go').onclick=load;$('rf').onclick=load;
  $('blk').onclick=function(){var n=$('n').value.replace(/\D/g,'');if(n.length<10){say('Enter the full number with country code.');return}
    if(!confirm('Block '+n+'? Arya will never message this number.'))return;
    api('/admin/call/optout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({number:n})}).then(function(j){say(j.ok?'Blocked.':'Failed ('+j.__s+').');if(j.ok){$('n').value='';load()}})};
  var R=document.documentElement,tm;try{R.setAttribute('data-theme',localStorage.getItem('adth')||'black')}catch(e){R.setAttribute('data-theme','black')}
  $('th').textContent=R.getAttribute('data-theme')==='white'?'\u{1F319}':'\u2600\uFE0F';
  $('th').onclick=function(){var n=R.getAttribute('data-theme')==='white'?'black':'white';R.setAttribute('data-theme',n);try{localStorage.setItem('adth',n)}catch(e){};this.textContent=n==='white'?'\u{1F319}':'\u2600\uFE0F'};
  $('ar').onchange=function(){clearInterval(tm);if(this.checked)tm=setInterval(function(){if(!$('out').hidden)load()},20000)};
})();
</script></div></body></html>
